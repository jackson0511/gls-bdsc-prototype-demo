<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Mobile KTV · v3 · Thợ máy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}};</script>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f1f5f9;color:#0f172a;min-height:100dvh}
    .shell{min-height:100dvh;display:flex;position:relative}
    .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40}
    .shell.nav-open .sidebar-backdrop{display:block}
    .sidebar{
      position:fixed;top:0;left:0;bottom:0;width:min(280px,86vw);z-index:50;
      background:#fff;border-right:1px solid #e2e8f0;
      transform:translateX(-105%);transition:transform .2s ease;
      display:flex;flex-direction:column;padding:16px 12px;
      box-shadow:8px 0 24px rgba(15,23,42,.08);
    }
    .shell.nav-open .sidebar{transform:translateX(0)}
    .sidebar-brand{padding:4px 8px 14px;border-bottom:1px solid #e2e8f0;margin-bottom:12px}
    .sidebar-brand .brand{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#059669}
    .sidebar-brand .sub{font-size:12px;color:#64748b;margin-top:4px;line-height:1.35}
    .sidenav{display:flex;flex-direction:column;gap:4px;flex:1;overflow:auto}
    .sidenav button{
      display:flex;align-items:center;gap:10px;width:100%;text-align:left;
      border:0;background:transparent;border-radius:.375rem;padding:11px 12px;
      font-size:14px;font-weight:600;color:#475569;font-family:inherit;cursor:pointer;
    }
    .sidenav button:hover{background:#f8fafc}
    .sidenav button.on{background:#eff6ff;color:#1d4ed8}
    .sidenav .ico{width:1.5rem;text-align:center;font-size:16px;line-height:1}
    .main-col{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100dvh}
    .topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30}
    .btn-menu{
      width:40px;height:40px;border:1px solid #e2e8f0;border-radius:.375rem;background:#fff;
      display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0;flex-shrink:0;
    }
    .btn-menu span{display:block;width:18px;height:2px;background:#334155;border-radius:1px}
    .topbar .brand{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#059669}
    .topbar .page-title{font-size:15px;font-weight:700;color:#0f172a;margin-top:1px}
    .wrap{width:100%;max-width:1100px;margin:0 auto;padding:16px;flex:1}
    .main{min-width:0}
    .list-grid{display:grid;grid-template-columns:1fr;gap:10px}
    .kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    @media(min-width:768px){
      .list-grid{grid-template-columns:1fr 1fr}
      .kpi-grid{grid-template-columns:repeat(4,1fr)!important}
    }
    @media(min-width:1024px){
      .sidebar{position:sticky;transform:none;box-shadow:none;width:240px;flex-shrink:0}
      .sidebar-backdrop,.btn-menu{display:none!important}
      .shell.nav-open .sidebar-backdrop{display:none}
      .wrap{padding:20px 24px 32px}
      .list-grid{grid-template-columns:1fr 1fr 1fr}
    }
    .surface{border:1px solid #e2e8f0;background:#fff;border-radius:.375rem;box-shadow:0 1px 2px rgba(15,23,42,.04)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-height:36px;border-radius:.375rem;border:1px solid #cbd5e1;padding:0 14px;font-size:14px;font-weight:500;box-shadow:0 1px 2px rgba(15,23,42,.05);font-family:inherit;cursor:pointer;background:#fff;color:#334155;box-sizing:border-box}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .btn:hover{background:#f8fafc;border-color:#94a3b8}
    .btn-primary{background:#2563eb;border-color:#1d4ed8;color:#fff}
    .btn-primary:hover{background:#1d4ed8;border-color:#1e40af;color:#fff}
    .btn-emerald{background:#059669;border-color:#047857;color:#fff}
    .btn-emerald:hover{background:#047857;border-color:#065f46;color:#fff}
    .btn-outline{background:#fff;border-color:#cbd5e1;color:#334155}
    .btn-orange{background:#ea580c;border-color:#c2410c;color:#fff}
    .btn-orange:hover{background:#c2410c;color:#fff}
    .btn-touch{min-height:40px;height:auto;padding:8px 12px}
    .btn-block{width:100%}
    .btn-sm{height:32px;min-height:32px;padding:0 10px;font-size:13px}
    .badge{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid;padding:2px 8px;font-size:11px;font-weight:500;white-space:nowrap;flex-shrink:0;line-height:1.25}
    .b-ns{border-color:#cbd5e1;background:#f1f5f9;color:#334155}
    .b-ip,.b-sky{border-color:#7dd3fc;background:#e0f2fe;color:#075985}
    .b-ok{border-color:#6ee7b7;background:#d1fae5;color:#065f46}
    .b-warn{border-color:#fcd34d;background:#fef3c7;color:#92400e}
    .b-bad{border-color:#fda4af;background:#ffe4e6;color:#9f1239}
    .b-orange{border-color:#fdba74;background:#ffedd5;color:#9a3412}
    .chip-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
    .chip{flex:0 0 auto;border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:#475569;font-family:inherit;cursor:pointer}
    .chip.on{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}
    .search{width:100%;min-height:40px;border:1px solid #cbd5e1;border-radius:.375rem;padding:8px 12px;font-size:16px;background:#fff;font-family:inherit}
    .search:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.25)}
    .assess{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
    .assess button{min-height:40px;border-radius:.375rem;border:1px solid #e2e8f0;background:#fff;color:#475569;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
    .assess .g{border-color:#059669;background:#059669;color:#fff}
    .assess .r{border-color:#f59e0b;background:#f59e0b;color:#fff}
    .assess .p{border-color:#dc2626;background:#dc2626;color:#fff}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;z-index:70;display:none;max-width:90%}
    .toast.on{display:block}
    .group{background:#f8fafc;padding:8px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#64748b;border-bottom:1px solid #e2e8f0}
    .shell-ftr{background:#fff;border:1px solid #e2e8f0;padding:12px 16px;display:grid;gap:8px;margin-top:12px;border-radius:.375rem}
    .empty{text-align:center;color:#94a3b8;font-size:13px;padding:28px 12px}
    .linkish{color:#2563eb;font-weight:600;background:none;border:0;padding:0;cursor:pointer;font-family:inherit;font-size:13px}
  </style>
</head>

      if ((p.vehicles || []).length) fromConsole = p;
    }
  } catch (e) { console.warn(e); }
  if (fromConsole) {
    DB.vehicles = fromConsole.vehicles || [];
    DB.orders = fromConsole.orders || [];
    DB.evaluationHistory = fromConsole.evaluationHistory || [];
    DB.evaluations = fromConsole.evaluations || {};
    DB.evalCriteria = (fromConsole.evalCriteria && fromConsole.evalCriteria.length) ? fromConsole.evalCriteria : FALLBACK_CRITERIA;
  } else {
    DB.vehicles = clone(SEED.vehicles);
    DB.orders = clone(SEED.orders);
    DB.evaluationHistory = clone(SEED.evaluationHistory);
    DB.evaluations = clone(SEED.evaluations || {});
    DB.evalCriteria = FALLBACK_CRITERIA;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const p = raw ? JSON.parse(raw) : {};
      if (!(p.vehicles || []).length) {
        p.vehicles = DB.vehicles;
        p.orders = DB.orders;
        p.evaluationHistory = DB.evaluationHistory;
        p.evaluations = DB.evaluations;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
      }

  }

}
function saveDB() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const p = raw ? JSON.parse(raw) : {};
    p.vehicles = DB.vehicles;
    p.orders = DB.orders;
    p.evaluationHistory = DB.evaluationHistory;
    p.evaluations = DB.evaluations;

}
function absorbDriverInbox() {
  try {
    const inbox = JSON.parse(localStorage.getItem(DRIVER_INBOX_KEY) || '[]');
    if (!Array.isArray(inbox) || !inbox.length) return;
    inbox.forEach(item => {
      if (!item || !item.id) return;
      if (DB.orders.some(o => String(o.id) === String(item.id))) return;
      DB.orders.unshift(item);
    });
    localStorage.setItem(DRIVER_INBOX_KEY, '[]');
    saveDB();
  } catch (_) {}
}
function ensurePretripSeed() {

function veh(id) { return DB.vehicles.find(v => Number(v.id) === Number(id)); }

function isMaint(o) {

function evalsOf(vid) { return (DB.evaluationHistory||[]).filter(e => Number(e.vehicleId)===Number(vid)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))); }

    <div>
      <h1 class="text-xl font-bold text-slate-900 m-0">Theo xe</h1>
      <p class="mt-0.5 text-xs text-slate-600 m-0">Chọn xe → lịch sử BD / SC</p>
    </div>
    <input class="search" id="q" value="${esc(q)}" placeholder="Biển số…" />
    <div class="chip-row">
      <button type="button" class="chip ${view.histKind==='MAINT'?'on':''}" data-hist-kind="MAINT">Xem BD</button>
      <button type="button" class="chip ${view.histKind==='REPAIR'?'on':''}" data-hist-kind="REPAIR">Xem SC</button>
    </div>
    <div class="surface overflow-hidden">
      <div class="group">Danh sách xe</div>
      <div class="list-grid p-3">${list.map(v => `<button type="button" class="surface w-full text-left p-3 !shadow-none" data-open-veh="${v.id}">
        <div class="flex justify-between gap-2">
          <div><div class="font-semibold text-sm">${esc(v.plate)}</div><div class="text-xs text-slate-500">${esc(v.model||v.type)} · ${kmFmt(v.km)} km</div></div>
          <span class="badge b-sky">${view.histKind==='MAINT'?'BD':'SC'}</span>
        </div>
      </button>`).join('') || '<div class="empty">Không có xe</div>'}</div>
    </div>
  </div>`;
}
function screenVehicleHist() {
  const v = veh(view.vehicleId);
  if (!v) return '<div class="empty p-4">Không có xe</div>';
  const kind = view.histKind || 'MAINT';
  const list = (kind === 'MAINT' ? ordersMaint() : ordersRepair()).filter(o => Number(o.vehicleId) === Number(v.id));
  return `
  <div class="px-4 pt-3 pb-2">
    <button type="button" class="linkish mb-2" data-back-veh>← Chọn xe</button>
    <div class="text-base font-bold">${esc(v.plate)}</div>
    <div class="text-xs text-slate-500 mt-0.5">Lịch sử ${kind==='MAINT'?'bảo dưỡng':'sửa chữa'} · ${list.length} phiếu</div>
  </div>
  <div class="px-4 pb-4 space-y-2.5">
    <div class="chip-row mb-1">
      <button type="button" class="chip ${kind==='MAINT'?'on':''}" data-hist-kind="MAINT">BD</button>
      <button type="button" class="chip ${kind==='REPAIR'?'on':''}" data-hist-kind="REPAIR">SC</button>
    </div>
    ${list.map(o => orderCard(o)).join('') || '<div class="empty">Chưa có lịch sử</div>'}
  </div>`;
}
function screenDriverInbox() {
  const list = driverReports();
  return `
  <div class="px-4 py-4 space-y-3">
    <button type="button" class="linkish" data-go-tab="home">← Hàng đợi</button>
    <div>
      <h1 class="text-xl font-bold text-slate-900 m-0">Báo cáo từ tài xế</h1>
      <p class="mt-0.5 text-xs text-slate-600 m-0">Nhận việc / mở phiếu SC</p>
    </div>
    <div class="chip-row">
      <button type="button" class="chip on" data-open-inbox="driver">Báo cáo SC</button>
      <button type="button" class="chip" data-open-inbox="pretrip">Trước chuyến</button>
    </div>
    <div class="space-y-2.5">${list.map(o => {
      const v = veh(o.vehicleId);
      return `<div class="surface p-3">
        <div class="flex justify-between gap-2">
          <div><div class="font-semibold text-sm">${esc(o.code)}</div><div class="text-xs text-slate-500">${esc(v?.plate||'—')} · ${esc(o.date||'')}</div><div class="text-xs text-slate-600 mt-1">${esc(o.content||'')}</div></div>
          ${statusBadge(o.status)}
        </div>
        <div class="grid grid-cols-2 gap-2 mt-2">
          <button type="button" class="btn btn-primary btn-sm" data-claim-order="${esc(o.id)}">Nhận việc</button>
          <button type="button" class="btn btn-outline btn-sm" data-open-order="${esc(o.id)}" data-order-tab="repair">Mở phiếu</button>
        </div>
      </div>`;
    }).join('') || '<div class="empty">Chưa có báo cáo từ app tài xế</div>'}</div>
  </div>`;
}
function screenPretrip() {
  const list = pretrips();
  return `
  <div class="px-4 py-4 space-y-3">
    <button type="button" class="linkish" data-go-tab="home">← Hàng đợi</button>
    <div>
      <h1 class="text-xl font-bold text-slate-900 m-0">Đánh giá trước chuyến</h1>
      <p class="mt-0.5 text-xs text-slate-600 m-0">Từ app tài xế · xác nhận / tạo SC</p>
    </div>
    <div class="chip-row">
      <button type="button" class="chip" data-open-inbox="driver">Báo cáo SC</button>
      <button type="button" class="chip on" data-open-inbox="pretrip">Trước chuyến</button>
    </div>
    <div class="space-y-2.5">${list.map(p => `
      <div class="surface p-3">
        <div class="flex justify-between gap-2">
          <div>
            <div class="font-semibold text-sm">${esc(p.plate)}</div>
            <div class="text-xs text-slate-500">${esc(p.driver)} · ${esc(p.at)}</div>
            <div class="text-xs text-slate-600 mt-1">${esc(p.note||'')}</div>
          </div>
          <span class="badge ${p.result==='PASS'?'b-ok':'b-bad'}">${p.result==='PASS'?'Đạt':'Lỗi'}</span>
        </div>
        <div class="flex flex-wrap gap-1 mt-2">${(p.items||[]).map(it=>`<span class="badge ${it.ok?'b-ok':'b-bad'}">${esc(it.label)}</span>`).join('')}</div>
        ${p.status==='NEW' && p.result==='FAIL' ? `<div class="grid grid-cols-2 gap-2 mt-2">
          <button type="button" class="btn btn-orange btn-sm" data-pretrip-sc="${esc(p.id)}">Tạo phiếu SC</button>
          <button type="button" class="btn btn-outline btn-sm" data-pretrip-ack="${esc(p.id)}">Đã xem</button>
        </div>` : (p.status==='NEW' ? `<button type="button" class="btn btn-outline btn-sm btn-block mt-2" data-pretrip-ack="${esc(p.id)}">Xác nhận đạt</button>` : `<div class="text-xs text-slate-500 mt-2">Đã xử lý</div>`)}
      </div>`).join('') || '<div class="empty">Chưa có phiếu trước chuyến</div>'}</div>
  </div>`;
}
function bind() {
  $$('#sidenav button').forEach(b => b.onclick = () => {
    view.filter = b.dataset.tab === 'eval' ? 'NEED' : 'OPEN';
    view.q = '';
    setNavOpen(false);
    go(b.dataset.tab, 'list', { resetQ:true });
  });
  $$('[data-go-tab]').forEach(b => b.onclick = () => {
    const tab = b.dataset.goTab;
    if (b.dataset.hist) view.histKind = b.dataset.hist;
    view.filter = tab === 'eval' ? 'NEED' : 'OPEN';
    go(tab, 'list');
  });
  $$('[data-open-inbox]').forEach(b => b.onclick = () => {
    view.tab = 'inbox';
    view.screen = b.dataset.openInbox === 'pretrip' ? 'pretrip' : 'driver';
    render();
  });
  const q = $('#q');
  if (q) q.oninput = () => { view.q = q.value; render(); };
  $$('[data-filter]').forEach(b => b.onclick = () => { view.filter = b.dataset.filter; render(); });
  $$('[data-open-order]').forEach(b => b.onclick = () => {
    const tab = b.dataset.orderTab || (isMaint(order(b.dataset.openOrder)) ? 'maint' : 'repair');
    go(tab, 'detail', { id: b.dataset.openOrder });
  });
  $$('[data-open-eval]').forEach(b => b.onclick = () => { view.evalDraft = null; go('eval', 'detail', { vehicleId: Number(b.dataset.openEval) }); });
  $$('[data-back-eval]').forEach(b => b.onclick = () => { view.evalDraft = null; go('eval', 'list'); });
  $$('[data-back-orders]').forEach(b => b.onclick = () => go(b.dataset.backOrders, 'list'));
  $$('[data-open-veh]').forEach(b => b.onclick = () => go('vehicle', 'hist', { vehicleId: Number(b.dataset.openVeh) }));
  $$('[data-back-veh]').forEach(b => b.onclick = () => go('vehicle', 'list'));
  $$('[data-hist-kind]').forEach(b => b.onclick = () => { view.histKind = b.dataset.histKind; render(); });
  $$('[data-assess]').forEach(b => b.onclick = () => {
    if (!view.evalDraft) return;
    const id = b.dataset.assess, val = b.dataset.val;
    view.evalDraft.items[id] = view.evalDraft.items[id] === val ? '' : val;
    const note = $('#evalNote');
    if (note) view.evalDraft.note = note.value;
    render();
  });
  $$('[data-mark-all-ok]').forEach(b => b.onclick = () => {
    if (!view.evalDraft) return;
    Object.keys(view.evalDraft.items).forEach(k => { view.evalDraft.items[k] = 'ok'; });
    render(); toast('Đã chọn Tất cả Tốt');
  });
  $$('[data-submit-eval]').forEach(b => b.onclick = () => submitEval());
  $$('[data-order-start]').forEach(b => b.onclick = () => {
    const o = order(view.id); if (!o) return;
    o.status = 'IN_PROGRESS'; o.technicianName = TECH;
    o.approvalLog = o.approvalLog || [];
    o.approvalLog.push({ at: stamp(), action: 'START', by: TECH, note: 'KTV bắt đầu trên mobile' });
    saveDB(); toast('Đã bắt đầu'); render();
  });
  $$('[data-order-done]').forEach(b => b.onclick = () => {
    const o = order(view.id); if (!o) return;
    o.status = 'COMPLETED';
    (o.workItems || []).forEach(w => { if (!w.completedAt) w.completedAt = stamp(); });
    o.approvalLog = o.approvalLog || [];
    o.approvalLog.push({ at: stamp(), action: 'COMPLETE', by: TECH, note: 'Hoàn thành trên mobile' });
    saveDB(); toast('Đã hoàn thành phiếu'); render();
  });
  $$('[data-wi-start]').forEach(b => b.onclick = () => {
    const o = order(view.id); const w = o && o.workItems && o.workItems[Number(b.dataset.wiStart)];
    if (!w) return;
    if (o.status === 'NOT_STARTED') o.status = 'IN_PROGRESS';
    w.startedAt = stamp(); o.technicianName = o.technicianName || TECH;
    saveDB(); render();
  });
  $$('[data-wi-done]').forEach(b => b.onclick = () => {
    const o = order(view.id); const w = o && o.workItems && o.workItems[Number(b.dataset.wiDone)];
    if (!w) return;
    w.completedAt = stamp();
    if (!(o.workItems || []).some(x => !x.completedAt)) o.status = 'COMPLETED';
    saveDB(); toast('Đã xong hạng mục'); render();
  });
  $$('[data-wi-skip]').forEach(b => b.onclick = () => {
    const o = order(view.id); const w = o && o.workItems && o.workItems[Number(b.dataset.wiSkip)];
    if (!w) return;
    w.completedAt = stamp(); w.skipped = true;
    saveDB(); render();
  });
  $$('[data-claim-order]').forEach(b => b.onclick = () => {
    const o = order(b.dataset.claimOrder); if (!o) return;
    o.technicianName = TECH;
    o.status = o.status === 'NOT_STARTED' ? 'IN_PROGRESS' : o.status;
    saveDB(); toast('Đã nhận việc'); go('repair', 'detail', { id: o.id });
  });
  $$('[data-pretrip-ack]').forEach(b => b.onclick = () => {
    const list = pretrips();
    const p = list.find(x => x.id === b.dataset.pretripAck);
    if (p) { p.status = 'DONE'; savePretrips(list); toast('Đã xác nhận'); render(); }
  });
  $$('[data-pretrip-sc]').forEach(b => b.onclick = () => {
    const list = pretrips();
    const p = list.find(x => x.id === b.dataset.pretripSc);
    if (!p) return;
    const id = uid('o');
    const o = {
      id, code: 'SC-TC-' + today().replace(/-/g,'') + '-' + Math.floor(100+Math.random()*900),
      vehicleId: p.vehicleId, type: 'INCIDENTAL', date: today(), km: p.km || 0,
      garage: (veh(p.vehicleId) && veh(p.vehicleId).garage) || 'Xưởng', source: 'PRE_TRIP', status: 'NOT_STARTED',
      approvalStatus: 'DRAFT', content: 'Từ ĐG trước chuyến · ' + (p.note || ''), system: 'Tổng quát',
      cost: 0, materials: [], workItems: [{ content: p.note || 'Kiểm tra sau trước chuyến', system: 'Tổng quát', kind: 'REPAIR' }],
      approvalLog: [{ at: stamp(), action: 'CREATE', by: TECH, note: 'Tạo từ ĐG trước chuyến TX' }],
    };
    DB.orders.unshift(o);
    p.status = 'DONE'; p.linkedOrderId = id;
    savePretrips(list); saveDB();
    toast('Đã tạo ' + o.code);
    go('repair', 'detail', { id });
  });
}
function submitEval() {
  const v = veh(view.vehicleId);
  const draft = view.evalDraft;
  if (!v || !draft) return;
  const noteEl = $('#evalNote');
  if (noteEl) draft.note = noteEl.value;
  const items = draft.items;
  const fail = Object.values(items).filter(a => a === 'repair' || a === 'replace').length;
  const good = Object.values(items).filter(a => a === 'ok').length;
  const ev = {
    id: uid('ev'), vehicleId: v.id, date: today(), status: 'SUBMITTED', note: draft.note || '',
    inspector: TECH, goodCount: good, failCount: fail, linkedOrderIds: [], items: { ...items },
  };
  DB.evaluationHistory = DB.evaluationHistory || [];
  DB.evaluationHistory.unshift(ev);
  DB.evaluations = DB.evaluations || {};
  DB.evaluations[v.id] = { status: 'SUBMITTED', date: today(), items };
  v.evalStatus = 'ok';
  v.lastEval = today();
  if (fail) {
    const id = uid('o');
    const o = {
      id, code: 'SC-DG-' + today().replace(/-/g,'') + '-' + Math.floor(100+Math.random()*900),
      vehicleId: v.id, type: 'INCIDENTAL', date: today(), km: v.km || 0, garage: v.garage || 'Xưởng',
      source: 'PERIODIC_ASSESSMENT', status: 'NOT_STARTED', approvalStatus: 'DRAFT',
      content: 'Từ đánh giá định kỳ · ' + fail + ' hạng mục', system: 'Tổng quát', cost: 0,
      materials: [], workItems: Object.entries(items).filter(([,a])=>a==='repair'||a==='replace').map(([cid])=>{
        const it = criteriaFor(v).flatMap(g=>g.items).find(x=>x.id===cid);
        return { content: (it && it.label) || cid, system: 'Đánh giá', kind: 'REPAIR' };
      }),
      approvalLog: [{ at: stamp(), action: 'CREATE', by: TECH, note: 'Tự tạo từ ĐG mobile' }],
    };
    DB.orders.unshift(o);
    ev.linkedOrderIds = [id];
    saveDB();
    view.evalDraft = null;
    toast('Đã nộp ĐG · tạo phiếu SC');
    go('repair', 'detail', { id });
    return;
  }
  saveDB();
  view.evalDraft = null;
  toast('Đã nộp đánh giá');
  go('eval', 'list');
}
try {
  const btn = document.getElementById('btnMenu');
  const backdrop = document.getElementById('sidebarBackdrop');
  if (btn) btn.onclick = () => setNavOpen(!document.getElementById('shell')?.classList.contains('nav-open'));
  if (backdrop) backdrop.onclick = () => setNavOpen(false);
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') setNavOpen(false); });
  loadDB();
  render();
} catch (err) {
  console.error(err);
  const root = document.getElementById('main');
  if (root) root.innerHTML = '<div class="surface m-4 p-4 empty">Không khởi tạo được: ' + String(err && err.message || err) + '</div>';
}


</script>
</body>
</html>
